name: sync-upstream
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/xiaofan6ya/workbuddy2api.git || true
          git fetch upstream master
          git merge upstream/master --no-edit -m "chore: sync upstream"
          git push origin HEAD:master
